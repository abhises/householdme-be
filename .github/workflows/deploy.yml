name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: householdme-be-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/abhises/householdme-be

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Build and push Docker image
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file and Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile
          target: /opt/householdme
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/householdme
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull be
            docker compose up -d db be caddy
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            # Wait for the API to become healthy (migrations run on start)
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q be)")" = healthy ] && break
              sleep 3
            done
            docker compose ps
            # Seed the design content and admin user once, on the very first deploy
            if [ ! -f .seeded ]; then
              docker compose exec -T be npx tsx prisma/seed.ts && touch .seeded
            fi
            docker logout ghcr.io
            docker image prune -f
