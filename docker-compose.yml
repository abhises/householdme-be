services:
  db:
    image: postgres:17-alpine
    container_name: householdme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: householdme
      POSTGRES_PASSWORD: householdme
      POSTGRES_DB: householdme
    ports:
      # Host port 5436 because 5432-5435 are already used on this machine.
      - "5436:5432"
    volumes:
      - householdme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U householdme -d householdme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  householdme-pgdata:
